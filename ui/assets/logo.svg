<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- GenAI Control Center - 3D Isometric AI Brain Icon -->
  <!-- Following Dynatrace App Icon Guidelines: 3D, matte finish, gradients, shadows -->
  
  <defs>
    <!-- Main gradient using Dynatrace palette color #528DEE (blue) -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BA3FF"/>
      <stop offset="50%" stop-color="#528DEE"/>
      <stop offset="100%" stop-color="#4075CC"/>
    </linearGradient>
    
    <!-- Top face gradient (lighter) -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DB5FF"/>
      <stop offset="100%" stop-color="#6BA3FF"/>
    </linearGradient>
    
    <!-- Right face gradient (darker) -->
    <linearGradient id="rightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4075CC"/>
      <stop offset="100%" stop-color="#3563AA"/>
    </linearGradient>
    
    <!-- Shadow gradient -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Inner glow for AI element -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  
  <!-- Drop shadow -->
  <ellipse cx="16" cy="28" rx="10" ry="2" fill="url(#shadowGradient)"/>
  
  <!-- 3D Isometric cube base - Left face -->
  <path d="M4 12 L16 6 L16 22 L4 28 Z" fill="url(#mainGradient)"/>
  
  <!-- 3D Isometric cube base - Right face -->
  <path d="M16 6 L28 12 L28 28 L16 22 Z" fill="url(#rightGradient)"/>
  
  <!-- 3D Isometric cube base - Top face -->
  <path d="M4 12 L16 6 L28 12 L16 18 Z" fill="url(#topGradient)"/>
  
  <!-- AI Sparkle/Star symbol (centered on top face) -->
  <g transform="translate(16, 12)">
    <!-- Main 4-point star -->
    <path d="M0 -5 L1 -1.5 L5 0 L1 1.5 L0 5 L-1 1.5 L-5 0 L-1 -1.5 Z" 
          fill="url(#glowGradient)" 
          stroke="#FFFFFF" 
          stroke-width="0.3"
          stroke-opacity="0.5"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>
  
  <!-- Small accent sparkles for AI effect -->
  <circle cx="22" cy="9" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="9" cy="10" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="24" cy="18" r="0.6" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Subtle highlight on top edge -->
  <path d="M4 12 L16 6 L28 12" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
